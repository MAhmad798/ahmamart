<!DOCTYPE html>
<html lang="en-PK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | AhmaMart</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
:root{color-scheme:light dark;--bg:#f4f4f4;--card:#fff;--ink:#14142b;--soft:#5b5b6b;--red:#ff4f45}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0e;--card:#17171b;--ink:#f1f1f3;--soft:#b9b9c4}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{max-width:520px;width:100%;background:var(--card);border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 1px 3px #0000001a}
.code{font-size:64px;font-weight:800;line-height:1;color:var(--red)}
h1{font-size:1.5rem;margin:12px 0 8px}
p{color:var(--soft);line-height:1.6;margin:0 0 20px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.b{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,#ff4f45,#ff6a1a);color:#fff}
a.g{background:none;color:var(--red);border:1.5px solid var(--red)}
</style>
</head>
<body>
<main class="box">
  <div class="code">404</div>
  <h1>This page could not be found</h1>
  <p>The link may be old or the product may no longer be available. Head back to the store to keep shopping.</p>
  <div class="btns"><a class="b" href="/">Go to AhmaMart</a><a class="b g" href="/contact.html">Contact us</a></div>
</main>
</body>
</html>
